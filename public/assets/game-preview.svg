<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18182b" />
      <stop offset="100%" stop-color="#0f0e1a" />
    </linearGradient>
    <linearGradient id="worldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2238" />
      <stop offset="100%" stop-color="#141122" />
    </linearGradient>
    <linearGradient id="barRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7675" />
      <stop offset="100%" stop-color="#d63031" />
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55efc4" />
      <stop offset="100%" stop-color="#00b894" />
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#74b9ff" />
      <stop offset="100%" stop-color="#0984e3" />
    </linearGradient>
    <linearGradient id="goldBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12" />
      <stop offset="100%" stop-color="#d35400" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Window Container -->
  <rect x="20" y="20" width="960" height="540" rx="14" fill="url(#windowBg)" stroke="rgba(124, 77, 255, 0.4)" stroke-width="2" filter="url(#shadow)" />

  <!-- Window Header Bar -->
  <rect x="20" y="20" width="960" height="42" rx="14" fill="#131222" />
  <rect x="20" y="48" width="960" height="14" fill="#131222" />
  <line x1="20" y1="62" x2="980" y2="62" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Traffic Lights -->
  <circle cx="48" cy="41" r="6" fill="#ff5f56" />
  <circle cx="68" cy="41" r="6" fill="#ffbd2e" />
  <circle cx="88" cy="41" r="6" fill="#27c93f" />

  <!-- URL / Header Title -->
  <rect x="300" y="30" width="400" height="24" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <text x="500" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#a29bfe" letter-spacing="1">
    🔒 https://youtube.com/playables/reverse-evolution
  </text>

  <!-- GAME BODY -->
  <!-- 1. Left Game World Viewport -->
  <g transform="translate(20, 62)">
    <rect width="660" height="498" fill="url(#worldBg)" />

    <!-- Ambient floating predator hazard -->
    <g transform="translate(480, 110)">
      <circle cx="20" cy="20" r="32" fill="rgba(231, 76, 60, 0.12)" />
      <text x="20" y="28" font-size="34" text-anchor="middle">🦁</text>
    </g>

    <g transform="translate(180, 340)">
      <circle cx="20" cy="20" r="28" fill="rgba(231, 76, 60, 0.12)" />
      <text x="20" y="28" font-size="30" text-anchor="middle">🦅</text>
    </g>

    <!-- Floating Challenge Banner -->
    <g transform="translate(330, 50)">
      <rect x="-190" y="-20" width="380" height="64" rx="12" fill="rgba(231, 76, 60, 0.92)" stroke="#ff7675" stroke-width="1.5" />
      <text x="0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#fff">
        ⚠️ Predators Hunting Apex Strength!
      </text>
      <text x="0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#ffeaa7">
        Devolve Strength to 30 or below to survive
      </text>
    </g>

    <!-- Player Creature -->
    <g transform="translate(310, 240)">
      <circle cx="25" cy="25" r="38" fill="rgba(124, 77, 255, 0.3)" />
      <text x="25" y="36" font-size="44" text-anchor="middle">🦎</text>
      <rect x="-10" y="68" width="70" height="18" rx="9" fill="rgba(0, 0, 0, 0.6)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
      <text x="25" y="81" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#00e5ff">
        YOU (PRIME)
      </text>
    </g>

    <!-- Desktop Hint -->
    <rect x="20" y="450" width="220" height="28" rx="6" fill="rgba(0, 0, 0, 0.6)" />
    <text x="30" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e0">
      🕹️ Move: <tspan font-weight="700" fill="#fff">WASD / Arrow Keys</tspan>
    </text>
  </g>

  <!-- 2. Right HUD Sidebar -->
  <g transform="translate(680, 62)">
    <rect width="300" height="498" fill="#151426" />
    <line x1="0" y1="0" x2="0" y2="498" stroke="rgba(124, 77, 255, 0.25)" stroke-width="1.5" />

    <!-- Header & Status Pill -->
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#fff" letter-spacing="1">
      REVERSE EVOLUTION
    </text>
    <rect x="180" y="18" width="104" height="20" rx="10" fill="rgba(46, 204, 113, 0.15)" stroke="rgba(46, 204, 113, 0.4)" stroke-width="1" />
    <circle cx="192" cy="28" r="4" fill="#2ecc71" />
    <text x="202" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#55efc4">
      Playables v1
    </text>

    <!-- Level Indicator -->
    <rect x="16" y="52" width="268" height="34" rx="8" fill="rgba(124, 77, 255, 0.15)" stroke="rgba(124, 77, 255, 0.3)" stroke-width="1" />
    <text x="150" y="73" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#d1c4e9">
      Level 1: The Hunting Grounds
    </text>

    <!-- Score Box -->
    <rect x="16" y="94" width="268" height="28" rx="6" fill="rgba(0, 0, 0, 0.3)" />
    <text x="26" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#a0aec0">
      Score: <tspan font-weight="700" fill="#fff">1,850</tspan>
    </text>
    <text x="274" y="112" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#a0aec0">
      Best: <tspan font-weight="700" fill="#ffd54f">4,200</tspan>
    </text>

    <!-- Traits Panel -->
    <rect x="16" y="132" width="268" height="210" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
    <text x="28" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#bb86fc">
      🧬 GENETIC ATROPHY
    </text>

    <!-- Trait 1: Strength -->
    <g transform="translate(26, 164)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#fff">💪 Str</text>
      <rect x="52" y="5" width="110" height="12" rx="6" fill="rgba(255, 255, 255, 0.1)" />
      <rect x="52" y="5" width="90" height="12" rx="6" fill="url(#barRed)" />
      <rect x="172" y="0" width="76" height="22" rx="5" fill="#e74c3c" />
      <text x="210" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#fff">Devolve</text>
    </g>

    <!-- Trait 2: Speed -->
    <g transform="translate(26, 198)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#fff">🏃 Spd</text>
      <rect x="52" y="5" width="110" height="12" rx="6" fill="rgba(255, 255, 255, 0.1)" />
      <rect x="52" y="5" width="50" height="12" rx="6" fill="#f39c12" />
      <rect x="172" y="0" width="76" height="22" rx="5" fill="#e74c3c" />
      <text x="210" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#fff">Devolve</text>
    </g>

    <!-- Trait 3: Intelligence -->
    <g transform="translate(26, 232)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#fff">🧠 Int</text>
      <rect x="52" y="5" width="110" height="12" rx="6" fill="rgba(255, 255, 255, 0.1)" />
      <rect x="52" y="5" width="25" height="12" rx="6" fill="url(#barGreen)" />
      <rect x="172" y="0" width="76" height="22" rx="5" fill="#e74c3c" />
      <text x="210" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#fff">Devolve</text>
    </g>

    <!-- Trait 4: Vision -->
    <g transform="translate(26, 266)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#fff">👁️ Vis</text>
      <rect x="52" y="5" width="110" height="12" rx="6" fill="rgba(255, 255, 255, 0.1)" />
      <rect x="52" y="5" width="20" height="12" rx="6" fill="url(#barGreen)" />
      <rect x="172" y="0" width="76" height="22" rx="5" fill="#e74c3c" />
      <text x="210" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#fff">Devolve</text>
    </g>

    <text x="150" y="322" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#718096">
      Green = Safely weak • Red = Dangerously strong
    </text>

    <!-- Rewarded Ad Button -->
    <rect x="16" y="354" width="268" height="38" rx="8" fill="url(#goldBtn)" />
    <text x="150" y="377" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fff">
      🎁 Rewarded Aid: Adapt Clue (Ad)
    </text>

    <!-- Secondary Controls -->
    <g transform="translate(16, 402)">
      <rect x="0" y="0" width="128" height="32" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="64" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#fff">🔊 Audio: ON</text>

      <rect x="140" y="0" width="128" height="32" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="204" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#fff">⏸️ Pause</text>
    </g>

    <!-- Reset Level -->
    <rect x="16" y="444" width="268" height="30" rx="6" fill="rgba(231, 76, 60, 0.15)" stroke="rgba(231, 76, 60, 0.3)" stroke-width="1" />
    <text x="150" y="463" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#ff7675">
      🔄 Reset Level Traits
    </text>
  </g>
</svg>
